<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nguyễn Ngọc Thảo Nguyên - Chúc Mừng</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Be Vietnam Pro & Dancing Script -->
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600&family=Dancing+Script:wght@600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        vietnam: ['Be Vietnam Pro', 'sans-serif'],
                        dancing: ['Dancing Script', 'cursive'],
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Be Vietnam Pro', sans-serif;
            background: #090310;
            color: #f3f4f6;
            overflow: hidden;
            height: 100vh;
            margin: 0;
        }

        /* Glassmorphic card */
        .glass-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        /* Hiệu ứng trái tim siêu siêu nhỏ 2px - 3px ở góc màn hình, lấp lánh nhẹ */
        @keyframes twinkle {
            0%, 100% { opacity: 0.2; transform: scale(1); }
            50% { opacity: 0.8; transform: scale(1.3); }
        }

        .micro-heart {
            position: absolute;
            width: 3px;
            height: 3px;
            background-color: rgba(244, 63, 94, 0.7);
            clip-path: polygon(50% 0%, 100% 35%, 82% 100%, 50% 75%, 18% 100%, 0% 35%);
            animation: twinkle 3s infinite ease-in-out;
        }

        .fade-transition {
            transition: opacity 0.5s ease-in-out, transform 0.5s ease-in-out;
        }
    </style>
</head>
<body class="flex items-center justify-center relative selection:bg-rose-500 selection:text-white">

    <!-- Background subtle ambient glow -->
    <div class="absolute top-1/3 left-1/3 w-64 h-64 bg-rose-900/10 rounded-full blur-3xl pointer-events-none"></div>

    <!-- Màn hình chính chứa các trạng thái -->
    <main class="w-full max-w-sm mx-4 relative z-20">

        <!-- 1. MÀN HÌNH ĐĂNG NHẬP -->
        <div id="loginScreen" class="glass-card rounded-3xl p-8 shadow-2xl fade-transition">
            <div class="text-center mb-6">
                <div class="inline-flex items-center justify-center w-14 h-14 rounded-full bg-white/5 text-rose-400 mb-4 border border-white/10">
                    <i class="fa-solid fa-lock text-xl"></i>
                </div>
                <h1 class="text-xl font-semibold tracking-wide text-white mb-1">Xác Thực Truy Cập</h1>
                <p class="text-xs text-gray-400">Vui lòng nhập mã để tiếp tục</p>
            </div>

            <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-4">
                <div>
                    <input 
                        type="text" 
                        id="passcode" 
                        placeholder="Nhập mã xác thực..." 
                        class="w-full px-4 py-3.5 rounded-2xl bg-white/5 border border-white/10 text-white placeholder-gray-500 focus:outline-none focus:border-rose-500/60 focus:ring-1 focus:ring-rose-500/30 transition-all text-center text-sm font-medium"
                        autocomplete="off"
                        required
                    >
                </div>

                <!-- Báo lỗi nhẹ -->
                <div id="errorMessage" class="hidden text-rose-400 text-xs text-center font-medium bg-rose-500/10 py-2 rounded-xl border border-rose-500/20">
                    Mã xác thực chưa chính xác.
                </div>

                <button 
                    type="submit"
                    class="w-full py-3.5 rounded-2xl bg-gradient-to-r from-rose-500 to-pink-600 text-white text-sm font-medium shadow-lg shadow-rose-500/20 hover:opacity-95 active:scale-[0.98] transition-all cursor-pointer"
                >
                    Vào Trong
                </button>
            </form>
        </div>


        <!-- 2. MÀN HÌNH BÊN TRONG -->
        <div id="mainContent" class="hidden opacity-0 scale-95 fade-transition text-center py-10 relative">
            <!-- Chỉ hiện chữ Chúc mừng thanh lịch, tối giản -->
            <div class="space-y-2">
                <h2 class="text-4xl md:text-5xl font-dancing font-bold text-white tracking-wide" style="text-shadow: 0 0 15px rgba(244,63,94,0.3);">
                    Chúc mừng
                </h2>
                <p class="text-xs tracking-widest text-gray-400 uppercase font-light">Nguyễn Ngọc Thảo Nguyên</p>
            </div>

            <div class="mt-8">
                <button 
                    onclick="handleLogout()"
                    class="px-4 py-2 rounded-xl bg-white/5 hover:bg-white/10 text-gray-400 text-xs transition-all border border-white/10 cursor-pointer"
                >
                    Khóa lại
                </button>
            </div>
        </div>

    </main>

    <!-- Các hình trái tim siêu siêu nhỏ (2px-3px) ở góc màn hình, phải nhìn kĩ mới thấy -->
    <div id="cornerMicroHearts" class="absolute inset-0 pointer-events-none z-30 overflow-hidden">
        <!-- Góc trên bên phải (Top Right) -->
        <div class="micro-heart" style="top: 18px; right: 24px; animation-delay: 0s;"></div>
        <div class="micro-heart" style="top: 25px; right: 35px; animation-delay: 1.2s; width: 2px; height: 2px;"></div>
        <div class="micro-heart" style="top: 32px; right: 20px; animation-delay: 0.5s; width: 2.5px; height: 2.5px;"></div>

        <!-- Góc dưới bên phải (Bottom Right) -->
        <div class="micro-heart" style="bottom: 22px; right: 28px; animation-delay: 0.8s;"></div>
        <div class="micro-heart" style="bottom: 30px; right: 40px; animation-delay: 2s; width: 2px; height: 2px;"></div>

        <!-- Góc trên bên trái (Top Left) -->
        <div class="micro-heart" style="top: 20px; left: 26px; animation-delay: 1.5s;"></div>

        <!-- Góc dưới bên trái (Bottom Left) -->
        <div class="micro-heart" style="bottom: 25px; left: 30px; animation-delay: 0.3s; width: 2px; height: 2px;"></div>
    </div>

    <script>
        function handleLogin(event) {
            event.preventDefault();
            const inputVal = document.getElementById('passcode').value.trim();
            const errorDiv = document.getElementById('errorMessage');
            const loginScreen = document.getElementById('loginScreen');
            const mainContent = document.getElementById('mainContent');

            // Chuẩn hóa chuỗi so sánh
            const targetPass = "Nguyễn Ngọc Thảo Nguyên";
            const normalizeStr = (str) => str.toLowerCase().replace(/\s+/g, ' ');

            if (normalizeStr(inputVal) === normalizeStr(targetPass)) {
                errorDiv.classList.add('hidden');

                // Hiệu ứng chuyển màn hình
                loginScreen.style.opacity = '0';
                loginScreen.style.transform = 'scale(0.95)';
                
                setTimeout(() => {
                    loginScreen.classList.add('hidden');
                    mainContent.classList.remove('hidden');
                    setTimeout(() => {
                        mainContent.style.opacity = '1';
                        mainContent.style.transform = 'scale(1)';
                    }, 50);
                }, 400);

            } else {
                errorDiv.classList.remove('hidden');
                const inputField = document.getElementById('passcode');
                inputField.classList.add('border-rose-500');
                setTimeout(() => {
                    inputField.classList.remove('border-rose-500');
                }, 600);
            }
        }

        function handleLogout() {
            const loginScreen = document.getElementById('loginScreen');
            const mainContent = document.getElementById('mainContent');

            mainContent.style.opacity = '0';
            mainContent.style.transform = 'scale(0.95)';

            setTimeout(() => {
                mainContent.classList.add('hidden');
                loginScreen.classList.remove('hidden');
                loginScreen.style.opacity = '1';
                loginScreen.style.transform = 'scale(1)';
                document.getElementById('passcode').value = '';
                document.getElementById('errorMessage').classList.add('hidden');
            }, 400);
        }
    </script>
</body>
</html>
